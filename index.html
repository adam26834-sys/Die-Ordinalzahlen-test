["Mittel","Welche Datumsangabe bedeutet den 10. Mai, wenn Tag und Monat als Zahlen gesprochen werden?",["am zehnten Fünften","am zehnte Fünfte","am zehnten Fünf"],0,"Bei der gesprochenen Zahlenform werden Tag und Monat als Ordinalzahlen verwendet. Der Monatsname wird substantiviert großgeschrieben: am zehnten Fünften. Üblicher ist im Alltag: am zehnten Mai."],
["Mittel","Ergänze: Ich bin am dritten ___ geboren. (3. Monat)",["Dritte","Dritten","Dritter"],1,"Wenn der Monat als Zahl ausgesprochen wird, steht auch er in der Ordinalform und wird substantiviert großgeschrieben: „am dritten Dritten“. Üblicher ist „am dritten März“."],
["Mittel","Welche Form passt für den 21. August, wenn der Monat als Zahl gesprochen wird?",["am einundzwanzigsten Achten","am einundzwanzigste Achte","am einundzwanzigsten Acht"],0,"Nach „am“ heißt es „einundzwanzigsten“. Der als Zahl ausgesprochene 8. Monat wird substantiviert großgeschrieben: „am einundzwanzigsten Achten“. Üblicher ist „am einundzwanzigsten August“."],
["Mittel","Wie sagt man den 5. Juli mit einer Zahl für den Monat?",["am fünften Siebten","am fünf Siebten","am fünfte Siebte"],0,"Der 5. Tag heißt nach „am“ „fünften“. Der als Zahl ausgesprochene 7. Monat wird substantiviert großgeschrieben: „am fünften Siebten“. Üblicher ist „am fünften Juli“."],
["Mittel","Welche Aussage ist richtig?",["„Ich bin am zehnten Fünften geboren“ kann den 10. Mai bedeuten.","„Ich bin am zehnte Fünfte geboren“ ist die richtige Form.","Der Monat darf nie als Ordinalzahl gesprochen werden."],0,"Die Zahlenform lautet „am zehnten Fünften“: Der Tag steht nach „am“ in der Form auf „-ten“; der als Zahl genannte Monat wird als Substantiv großgeschrieben. Im Alltag ist „am zehnten Mai“ meist natürlicher."]

];let n=0,score=0,chosen=Array(Q.length).fill(null);const $=x=>document.getElementById(x);
function draw(){if(n>=Q.length){finish();return}let q=Q[n];$('counter').textContent=`Frage ${n+1} von ${Q.length}`;$('score').textContent=`Punkte: ${score}`;$('bar').style.width=`${n/Q.length*100}%`;$('level').textContent=q[0];$('question').textContent=q[1];$('answers').innerHTML='';$('feedback').className='feedback';$('feedback').innerHTML='';q[2].forEach((a,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+i)+'. '+a;b.disabled=chosen[n]!==null;if(chosen[n]!==null){if(i===q[3])b.classList.add('correct');else if(i===chosen[n])b.classList.add('wrong')}b.onclick=()=>pick(i);$('answers').appendChild(b)});$('back').disabled=n===0;$('next').disabled=chosen[n]===null;$('next').textContent=n===Q.length-1?'Ergebnis anzeigen →':'Weiter →';if(chosen[n]!==null)feedback(chosen[n])}
function pick(i){if(chosen[n]!==null)return;chosen[n]=i;if(i===Q[n][3])score++;draw();$('bar').style.width=`${(n+1)/Q.length*100}%`}
function feedback(i){let q=Q[n],ok=i===q[3],f=$('feedback');f.className='feedback show '+(ok?'good':'bad');f.innerHTML=`<strong>${ok?'✓ Richtig!':'✗ Leider nicht richtig.'}</strong><div><b>Richtige Antwort:</b> ${q[2][q[3]]}</div><div><b>Erklärung:</b> ${q[4]}</div>`}
function finish(){$('quiz').hidden=true;$('summary').hidden=false;$('bar').style.width='100%';$('counter').textContent='Quiz beendet';$('score').textContent=`Punkte: ${score} von ${Q.length}`;let p=Math.round(score/Q.length*100);$('summary').innerHTML=`<span class="level">Fertig</span><h2>${p>=90?'Ausgezeichnet!':p>=70?'Gut gemacht! Übe weiter.':'Übe weiter – du wirst besser!'}</h2><div style="font-size:3rem;font-weight:900;color:#1769aa">${score} / ${Q.length}</div><p>${p} % richtig</p><p>Sieh dir die Erklärungen an und versuche es noch einmal.</p><ul style="text-align:left;line-height:1.8"><li>1–19: meistens <b>-te</b>; nach <b>am</b>: <b>-ten</b>.</li><li>Ab 20: meistens <b>-ste</b>; nach <b>am</b>: <b>-sten</b>.</li><li>Besondere Formen: <b>erste, dritte, siebte, achte</b>.</li></ul><button class="nav" id="restart">Noch einmal versuchen ↻</button>`;$('restart').onclick=()=>{n=0;score=0;chosen.fill(null);$('summary').hidden=true;$('quiz').hidden=false;draw()}}
$('back').onclick=()=>{if(n>0){n--;draw()}};$('next').onclick=()=>{if(chosen[n]!==null){n++;draw()}};draw();
</script></body></html>
